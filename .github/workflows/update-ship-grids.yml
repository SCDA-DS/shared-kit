name: Update ship cargo grids

# Regenerates packages/sc-data/src/ships.generated.ts from the Star Citizen Wiki API and commits it if it changed.
on:
  schedule:
    - cron: '23 4 * * 1'   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-ship-grids.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- packages/sc-data/src/ships.generated.ts; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sc-data/src/ships.generated.ts
          git commit -m "Update ship cargo grids from the Star Citizen Wiki"
          git push
